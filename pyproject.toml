[project]
name = "plato-mcp"
version = "0.1.0"
description = "PLATO rooms as MCP tools. Any MCP-compatible framework can use PLATO."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.24", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff"]

[project.scripts]
plato-mcp = "plato_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
